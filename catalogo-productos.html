<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sembrando Vida — Catálogo de Productos Artesanales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="eyebrow">Hecho a mano · Cosechado con paciencia</div>
  <h1>Sembrando Vida</h1>
  <div class="rule"></div>
  <p class="sub">Un catálogo de productos artesanales elaborados por manos del campo.</p>
</header>

<div class="toolbar">
  <input type="search" id="buscador" placeholder="Buscar un producto…" autocomplete="off">
  <span class="count" id="contador"></span>
</div>

<main>
  <div id="grid">
    <div class="state" id="estado">
      <div class="stamp-circle"></div>
      <h3>Cargando el catálogo…</h3>
      <p>Trayendo los productos del campo.</p>
    </div>
  </div>
</main>

<footer class="site">Catálogo de productores locales</footer>

<script src="script.js"></script>
</body>
</html>
